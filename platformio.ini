[platformio]
default_envs = punkt

[env:punkt]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; the Super Mini carries a 4MB flash chip, the devkitc-1 profile assumes 8MB
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++11
lib_deps =
    adafruit/Adafruit LED Backpack Library
    adafruit/Adafruit GFX Library
    tzapu/WiFiManager @ ^2.0.17
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    bblanchon/ArduinoJson @ ^7.4.3

[env:punkt-ota]
extends = env:punkt
upload_protocol = espota
upload_port = punkt.local

; flashes through the chip's built-in USB JTAG with OpenOCD, bypassing the USB serial driver
[env:punkt-jtag]
extends = env:punkt
upload_protocol = esp-builtin
debug_tool = esp-builtin

[env:strich]
extends = env:punkt
build_flags =
    ${env:punkt.build_flags}
    -DPUNKT_BOARD_STRICH

[env:strich-ota]
extends = env:strich
upload_protocol = espota
upload_port = strich.local

; flashes through the chip's built-in USB JTAG with OpenOCD, bypassing the USB serial driver
[env:strich-jtag]
extends = env:strich
upload_protocol = esp-builtin
debug_tool = esp-builtin
