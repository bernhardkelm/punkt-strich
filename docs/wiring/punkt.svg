<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
<title>punkt wiring</title>
<desc>Wiring of punkt: Super Mini, one HT16K33 backpack and one touch coin</desc>
<rect x="200" y="150" width="130" height="200" rx="6" fill="#1f2328" fill-opacity="0.05" stroke="#1f2328" stroke-width="1.5"/>
<text x="265.0" y="298" text-anchor="middle" fill="#656d76" font-size="12">ESP32-S3</text>
<text x="265.0" y="314" text-anchor="middle" fill="#656d76" font-size="12">Super Mini</text>
<text x="265.0" y="330" text-anchor="middle" fill="#656d76" font-size="10">(not to scale)</text>
<circle cx="330" cy="190" r="3" fill="#cf222e"/>
<text x="322" y="194" text-anchor="end" fill="#cf222e" font-size="12">5V</text>
<circle cx="330" cy="230" r="3" fill="#1f2328"/>
<text x="322" y="234" text-anchor="end" fill="#1f2328" font-size="12">GND</text>
<circle cx="330" cy="270" r="3" fill="#0969da"/>
<text x="322" y="274" text-anchor="end" fill="#0969da" font-size="12">GPIO8 SDA</text>
<circle cx="330" cy="310" r="3" fill="#0969da"/>
<text x="322" y="314" text-anchor="end" fill="#0969da" font-size="12">GPIO9 SCL</text>
<rect x="420" y="150" width="130" height="190" rx="6" fill="#1f2328" fill-opacity="0.05" stroke="#1f2328" stroke-width="1.5"/>
<text x="485" y="240" text-anchor="middle" fill="#656d76" font-size="12">backpack</text>
<text x="485" y="256" text-anchor="middle" fill="#656d76" font-size="12">0x70</text>
<circle cx="420" cy="190" r="3" fill="#cf222e"/>
<text x="430" y="194" text-anchor="start" fill="#cf222e" font-size="12">+</text>
<circle cx="420" cy="230" r="3" fill="#1f2328"/>
<text x="430" y="234" text-anchor="start" fill="#1f2328" font-size="12">-</text>
<circle cx="420" cy="270" r="3" fill="#0969da"/>
<text x="430" y="274" text-anchor="start" fill="#0969da" font-size="12">D</text>
<circle cx="420" cy="310" r="3" fill="#0969da"/>
<text x="430" y="314" text-anchor="start" fill="#0969da" font-size="12">C</text>
<line x1="330" y1="190" x2="420" y2="190" stroke="#cf222e" stroke-width="1.5" stroke-linecap="round"/>
<text x="375" y="184" text-anchor="middle" fill="#cf222e" font-size="10">5V</text>
<line x1="330" y1="230" x2="420" y2="230" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round"/>
<text x="375" y="224" text-anchor="middle" fill="#1f2328" font-size="10">GND</text>
<line x1="330" y1="270" x2="420" y2="270" stroke="#0969da" stroke-width="1.5" stroke-linecap="round"/>
<text x="375" y="264" text-anchor="middle" fill="#0969da" font-size="10">SDA</text>
<line x1="330" y1="310" x2="420" y2="310" stroke="#0969da" stroke-width="1.5" stroke-linecap="round"/>
<text x="375" y="304" text-anchor="middle" fill="#0969da" font-size="10">SCL</text>
<circle cx="265" cy="150" r="3" fill="#9a6700"/>
<text x="265" y="170" text-anchor="middle" fill="#9a6700" font-size="11">GPIO4</text>
<line x1="265" y1="150" x2="265" y2="90" stroke="#9a6700" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="265" cy="64" r="26" fill="none" stroke="#9a6700" stroke-width="1.5"/>
<circle cx="265" cy="64" r="20" fill="none" stroke="#9a6700" stroke-width="1.5"/>
<text x="265" y="20" text-anchor="middle" fill="#9a6700" font-size="11">coin</text>
</svg>
