<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
<title>punkt wiring</title>
<desc>Wiring of punkt: Super Mini, one HT16K33 backpack and one touch coin</desc>
<rect x="200" y="150" width="130" height="200" rx="6" fill="#e6edf3" fill-opacity="0.05" stroke="#e6edf3" stroke-width="1.5"/>
<text x="265.0" y="298" text-anchor="middle" fill="#8b949e" font-size="12">ESP32-S3</text>
<text x="265.0" y="314" text-anchor="middle" fill="#8b949e" font-size="12">Super Mini</text>
<text x="265.0" y="330" text-anchor="middle" fill="#8b949e" font-size="10">(not to scale)</text>
<circle cx="330" cy="190" r="3" fill="#ff7b72"/>
<text x="322" y="194" text-anchor="end" fill="#ff7b72" font-size="12">5V</text>
<circle cx="330" cy="230" r="3" fill="#e6edf3"/>
<text x="322" y="234" text-anchor="end" fill="#e6edf3" font-size="12">GND</text>
<circle cx="330" cy="270" r="3" fill="#79c0ff"/>
<text x="322" y="274" text-anchor="end" fill="#79c0ff" font-size="12">GPIO8 SDA</text>
<circle cx="330" cy="310" r="3" fill="#79c0ff"/>
<text x="322" y="314" text-anchor="end" fill="#79c0ff" font-size="12">GPIO9 SCL</text>
<rect x="420" y="150" width="130" height="190" rx="6" fill="#e6edf3" fill-opacity="0.05" stroke="#e6edf3" stroke-width="1.5"/>
<text x="485" y="240" text-anchor="middle" fill="#8b949e" font-size="12">backpack</text>
<text x="485" y="256" text-anchor="middle" fill="#8b949e" font-size="12">0x70</text>
<circle cx="420" cy="190" r="3" fill="#ff7b72"/>
<text x="430" y="194" text-anchor="start" fill="#ff7b72" font-size="12">+</text>
<circle cx="420" cy="230" r="3" fill="#e6edf3"/>
<text x="430" y="234" text-anchor="start" fill="#e6edf3" font-size="12">-</text>
<circle cx="420" cy="270" r="3" fill="#79c0ff"/>
<text x="430" y="274" text-anchor="start" fill="#79c0ff" font-size="12">D</text>
<circle cx="420" cy="310" r="3" fill="#79c0ff"/>
<text x="430" y="314" text-anchor="start" fill="#79c0ff" font-size="12">C</text>
<line x1="330" y1="190" x2="420" y2="190" stroke="#ff7b72" stroke-width="1.5" stroke-linecap="round"/>
<text x="375" y="184" text-anchor="middle" fill="#ff7b72" font-size="10">5V</text>
<line x1="330" y1="230" x2="420" y2="230" stroke="#e6edf3" stroke-width="1.5" stroke-linecap="round"/>
<text x="375" y="224" text-anchor="middle" fill="#e6edf3" font-size="10">GND</text>
<line x1="330" y1="270" x2="420" y2="270" stroke="#79c0ff" stroke-width="1.5" stroke-linecap="round"/>
<text x="375" y="264" text-anchor="middle" fill="#79c0ff" font-size="10">SDA</text>
<line x1="330" y1="310" x2="420" y2="310" stroke="#79c0ff" stroke-width="1.5" stroke-linecap="round"/>
<text x="375" y="304" text-anchor="middle" fill="#79c0ff" font-size="10">SCL</text>
<circle cx="265" cy="150" r="3" fill="#e3b341"/>
<text x="265" y="170" text-anchor="middle" fill="#e3b341" font-size="11">GPIO4</text>
<line x1="265" y1="150" x2="265" y2="90" stroke="#e3b341" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="265" cy="64" r="26" fill="none" stroke="#e3b341" stroke-width="1.5"/>
<circle cx="265" cy="64" r="20" fill="none" stroke="#e3b341" stroke-width="1.5"/>
<text x="265" y="20" text-anchor="middle" fill="#e3b341" font-size="11">coin</text>
</svg>
